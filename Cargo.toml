[package]
name = "libra"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart", "http2"] }
scraper = "0.20"
dirs = "6"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15"
futures-util = "0.3"
pdf-extract = "0.7"
redis = { version = "1.7.1", default-features = false, features = ["tokio-comp", "connection-manager"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono-tz = "0.10"
cron = "0.17"
base64 = "0.23.1"
