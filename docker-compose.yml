services:
  libra:
    build: .
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      LIBRA_DATA_DIR: /data
      REDIS_URL: redis://redis:6379
      SEARXNG_API_URL: http://searxng:8080
      OBSCURA_BIN: /usr/local/bin/obscura
      RUST_LOG: info
      # The port below is published on the host. Set a token before exposing it anywhere real.
      # LIBRA_AUTH_TOKEN: change-me
      # Model providers are added in Settings → Model providers, not here.
    volumes:
      - libra-data:/data
      # msb keeps its guest images and sandbox state here; without a volume every job
      # run re-downloads its image. This is $HOME of the image's unprivileged user.
      - microsandbox-data:/home/libra/.microsandbox
    # Command jobs boot a microVM, so the container needs the hypervisor device. Linux
    # Docker Engine passes it straight through; Docker Desktop's Linux VM often does not
    # expose /dev/kvm at all. Check with: docker compose exec libra msb doctor
    # devices:
    #   - /dev/kvm:/dev/kvm
    depends_on:
      - redis
      - searxng
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  searxng:
    # Pinned by digest: `latest` resolved to the 2026.11.21-c6ee3e9fd image on 2026-11-21.
    # Bump the digest deliberately, and re-run the JSON search check with the bump.
    image: searxng/searxng@sha256:fc1d81d7e9d04d3c8b3e23c7162feddf5c3d6aecd32e67a56eaabcb8d8747f79
    # SearxNG is reached over the compose network as http://searxng:8080. Nothing is
    # published on the host: the image proxy fetches whatever URL it is handed, so a
    # host port would make this an unauthenticated fetch proxy next to Libra.
    expose:
      - "8080"
    volumes:
      # settings.yml ships read-only; the wrapper copies it into the volume below on
      # start and generates the secret_key there, so no secret is tracked in git.
      - ./docker/searxng:/opt/libra-searxng:ro
      - searxng-config:/etc/searxng
    entrypoint: ["/bin/sh", "/opt/libra-searxng/entrypoint.sh"]
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    restart: unless-stopped

volumes:
  libra-data:
  microsandbox-data:
  redis-data:
  searxng-config:
