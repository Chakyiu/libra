services:
  libra:
    build: .
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      LIBRA_DATA_DIR: /data
      DATABASE_URL: /data/libra.db
      REDIS_URL: redis://redis:6379
      SEARXNG_API_URL: http://searxng:8080
      OBSCURA_BIN: /usr/local/bin/obscura
      RUST_LOG: info
      # The port below is published on the host. Set a token before exposing it anywhere real.
      # LIBRA_AUTH_TOKEN: change-me
      # Model providers are added in Settings → Model providers, not here.
    volumes:
      - libra-data:/data
    depends_on:
      - redis
      - searxng
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./docker/searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://localhost:8888/
    ports:
      - "8888:8080"
    restart: unless-stopped

volumes:
  libra-data:
  redis-data:
